[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eulerpool"
version = "1.0.0"
description = "Official Python SDK for the Eulerpool Financial Data API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Eulerpool Research Systems", email = "api@eulerpool.com" }]
keywords = ["eulerpool", "financial-data", "api", "stocks", "etf", "bonds", "crypto", "forex", "macro", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24.0"]

[project.urls]
Homepage = "https://eulerpool.com/developers"
Documentation = "https://eulerpool.com/developers"
Repository = "https://github.com/eulerpool/eulerpool-python"
